name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet restore FastBulkProcessor.slnx
      - run: dotnet test FastBulkProcessor.slnx --no-restore
